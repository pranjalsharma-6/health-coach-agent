# Render Blueprint for the Kaya API.
#
# Deploys the backend only. The frontend goes to Vercel, which serves it from a
# CDN edge with no cold start at all — the thing that made the Streamlit
# deployment feel broken to anyone opening the link cold.
#
# To use: Render dashboard → New → Blueprint → point at this repo.
# Secrets marked `sync: false` are entered in the dashboard, never committed.

services:
  - type: web
    name: kaya-api
    runtime: python
    plan: free
    region: singapore # closest to most users of this project; change if needed
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    # Render polls this; it also gives the keepalive workflow a target.
    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: MONGODB_DB_NAME
        value: KayaDB

      # Reasoning models spend part of the output budget thinking before they
      # answer. On a free-tier rate limit that can consume the whole budget and
      # leave nothing for the structured result, which surfaces as
      # "tool_use_failed" with an empty generation rather than as a limit.
      - key: LLM_REASONING_EFFORT
        value: low
      # A seven-day plan costs roughly 7500 tokens of an 8000-per-minute free
      # tier, leaving no room for the retry the agent is designed around.
      - key: PLAN_DURATION_DAYS
        value: "4"
      # LLM_MODEL is deliberately absent: blank means "the provider's default",
      # which is the only value that stays correct as providers retire models.
      # Set it here only to pin a specific model, and only one belonging to the
      # provider whose key is set below — the API refuses a mismatched pair at
      # startup rather than discovering it mid-run.

      # --- Set these in the Render dashboard ---
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        # Render generates a strong value on first deploy.
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      # Your Vercel URL, comma-separated. Without this the browser blocks
      # every request from the frontend as a CORS failure.
      - key: CORS_ORIGINS
        sync: false
